[project]
name = "private-cloud-music-player-backend"
version = "0.1.0"
description = "Serverless backend for the Private Cloud Music Player"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
